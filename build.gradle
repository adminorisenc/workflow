plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.orisenc'
version = '0.1.0-SNAPSHOT'
description = 'Workflow and Task Management microservice'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
  implementation 'com.orisenc:orisenc-security-spring-boot-starter:1.2.1'

  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'org.postgresql:postgresql'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  // The SLA scan is two hand-written JPQL queries, one of them a self-join. Neither is checked by
  // the compiler, and a malformed one fails at the first scheduled pass in production rather than
  // in the build - so the suite runs them against a real engine. Matches Accounts and Integration.
  testRuntimeOnly 'com.h2database:h2'
  testImplementation 'org.assertj:assertj-core'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
